# Cluster add-ons installed on every cluster registered with addons=enabled
# (the hub and each environment). Add-on versions are pinned here, in one place.
#
# Per-cluster settings come from the cluster's Argo CD annotations, written by
# the provisioning tooling, so no domain, hostname or port is hard-coded:
#   lab/gateway-hostnames        space-separated hostnames (wildcard on workers)
#   lab/gateway-http-nodeport    Envoy NodePorts kind maps :80/:443 onto
#   lab/gateway-https-nodeport
#   lab/argocd-route             "true" on the hub: route Argo CD through the gateway
#   lab/domain                   the cluster's DNS suffix (argocd.<domain> on the hub)
#   lab/ingest-*                 the hub's mTLS telemetry listener (enabled on the hub)
#   lab/observability-*          where this cluster's agents push telemetry
---
# Add-ons are cluster infrastructure (CRDs, webhooks, cluster roles), so this
# project can create cluster-scoped kinds, but only in its own namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  description: Per-cluster infrastructure (cert-manager, Envoy Gateway, shared Gateway)
  sourceRepos:
    - https://github.com/sfy247/omarchy-k8s-platform.git
    - https://charts.jetstack.io
    - https://cloudnative-pg.github.io/charts
    - https://argoproj.github.io/argo-helm
    - oci://docker.io/envoyproxy/gateway-helm
  destinations:
    - { name: "*", namespace: cert-manager }
    - { name: "*", namespace: kube-system }   # cert-manager leader election
    - { name: "*", namespace: envoy-gateway-system }
    - { name: "*", namespace: gateway }
    - { name: "*", namespace: argocd }        # Argo CD HTTPRoute on the hub
    - { name: "*", namespace: cnpg-system }
    - { name: "*", namespace: observability }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels: { addons: enabled }
  template:
    metadata:
      name: 'cert-manager-{{.name}}'
      labels: { app.kubernetes.io/part-of: cluster-addons }
    spec:
      project: cluster-addons
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.21.3
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        name: '{{.name}}'
        namespace: cert-manager
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels: { addons: enabled }
  template:
    metadata:
      name: 'envoy-gateway-{{.name}}'
      labels: { app.kubernetes.io/part-of: cluster-addons }
    spec:
      project: cluster-addons
      source:
        repoURL: oci://docker.io/envoyproxy/gateway-helm
        targetRevision: 1.9.3
        path: .
      destination:
        name: '{{.name}}'
        namespace: envoy-gateway-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Needs the CRDs from the two apps above; retries until they exist
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels: { addons: enabled }
  template:
    metadata:
      name: 'gateway-{{.name}}'
      labels: { app.kubernetes.io/part-of: cluster-addons }
    spec:
      project: cluster-addons
      source:
        repoURL: https://github.com/sfy247/omarchy-k8s-platform.git
        targetRevision: main
        path: cluster-addons/gateway
        helm:
          parameters:
            - name: hostnames
              value: '{{index .metadata.annotations "lab/gateway-hostnames"}}'
            - name: nodePorts.http
              value: '{{index .metadata.annotations "lab/gateway-http-nodeport"}}'
            - name: nodePorts.https
              value: '{{index .metadata.annotations "lab/gateway-https-nodeport"}}'
            - name: argocdRoute.enabled
              value: '{{index .metadata.annotations "lab/argocd-route"}}'
            - name: argocdRoute.hostname
              value: 'argocd.{{index .metadata.annotations "lab/domain"}}'
            - name: ingest.enabled
              value: '{{index .metadata.annotations "lab/ingest-enabled"}}'
            - name: ingest.hostname
              value: '{{index .metadata.annotations "lab/ingest-hostname"}}'
            - name: ingest.nodePort
              value: '{{index .metadata.annotations "lab/ingest-node-port"}}'
      destination:
        name: '{{.name}}'
        namespace: gateway
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 20
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
---
# Postgres operator on every cluster: app data on workers, the portal's own
# database on the hub
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels: { addons: enabled }
  template:
    metadata:
      name: 'cloudnative-pg-{{.name}}'
      labels: { app.kubernetes.io/part-of: cluster-addons }
    spec:
      project: cluster-addons
      source:
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: 0.29.1
      destination:
        name: '{{.name}}'
        namespace: cnpg-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Telemetry agents on every cluster (hub included): Alloy + exporters, pushing
# metrics, logs and events to the hub with cluster=<name>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-agents
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels: { addons: enabled }
  template:
    metadata:
      name: 'observability-agents-{{.name}}'
      labels: { app.kubernetes.io/part-of: observability }
      annotations:
        # Diff against what the API server would store (CRD defaults included)
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: cluster-addons
      source:
        repoURL: https://github.com/sfy247/omarchy-k8s-platform.git
        targetRevision: main
        path: charts/observability-agents
        helm:
          releaseName: observability-agents
          valuesObject:
            cluster: '{{.name}}'
            ingest:
              url: '{{index .metadata.annotations "lab/observability-ingest-url"}}'
              serverName: '{{index .metadata.annotations "lab/observability-ingest-server"}}'
            clientCert:
              dnsName: 'alloy.{{index .metadata.annotations "lab/domain"}}'
          # --set yields a real boolean; Helm dependency conditions ignore strings.
          # The hub's backend already runs the exporters.
          parameters:
            - name: exporters.enabled
              value: '{{ ne (index .metadata.annotations "lab/observability-exporters") "false" }}'
      destination:
        name: '{{.name}}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 20
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
        # node-exporter and log tailing need host access: this namespace is the
        # documented exception to Pod Security "restricted"
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/warn: baseline
