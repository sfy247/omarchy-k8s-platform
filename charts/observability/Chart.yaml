apiVersion: v2
name: observability
description: >-
  Central observability backend on the hub: Prometheus (remote-write receiver,
  rules), Alertmanager, Loki and Grafana. Agents on every cluster push to it
  through an mTLS ingest endpoint on the hub gateway.
type: application
version: 0.1.0
dependencies:
  - name: kube-prometheus-stack
    version: 92.16.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: 7.5.0
    repository: https://grafana.github.io/helm-charts
