apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-service.name" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # After the migrations Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-service.labels" . | nindent 8 }}
        {{- if .Values.database.enabled }}
        {{ .Values.database.clientLabel.key }}: {{ .Values.database.clientLabel.value | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "web-service.name" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            {{- if .Values.database.enabled }}
            {{- $db := .Values.database }}
            # libpq-style connection settings; login is by client certificate
            - { name: PGHOST, value: "{{ $db.cluster }}-rw.{{ $db.namespace }}.svc" }
            - { name: PGPORT, value: {{ $db.port | quote }} }
            - { name: PGDATABASE, value: {{ include "web-service.dbRole" . | quote }} }
            - { name: PGUSER, value: {{ include "web-service.dbRole" . | quote }} }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLCERT, value: "{{ $db.certPath }}/tls.crt" }
            - { name: PGSSLKEY, value: "{{ $db.certPath }}/tls.key" }
            - { name: PGSSLROOTCERT, value: "{{ $db.certPath }}/ca.crt" }
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.database.enabled }}
            - name: postgres-client
              mountPath: {{ .Values.database.certPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.database.enabled }}
        # The app's client certificate, its key and the CA (renewed by cert-manager)
        - name: postgres-client
          secret:
            secretName: {{ include "web-service.name" . }}-db-cert
            defaultMode: 0440
        {{- end }}
        # Writable scratch space, since the root filesystem is read-only
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
