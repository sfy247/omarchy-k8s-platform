{{- if .Values.networkPolicy.enabled }}
# Default-deny for this pod: only HTTP in; out only DNS (+ Postgres if database.enabled)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-service.name" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if .Values.database.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.database.namespace }}
          podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.database.cluster }}
      ports:
        - { port: {{ .Values.database.port }}, protocol: TCP }
    {{- end }}
{{- end }}
