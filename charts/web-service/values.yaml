nameOverride: ""
replicaCount: 1

image:
  repository: web-service
  tag: "0.1.0"
  # Images are side-loaded into kind, so never pull from a registry
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: NodePort
  port: 80
  nodePort: null

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 128Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true

# Expose through the cluster's shared Gateway (cluster-addons/gateway)
route:
  enabled: false
  hostname: ""          # set per environment by the ApplicationSet
  gateway:
    name: shared
    namespace: gateway
    sectionName: https

# Own PostgreSQL database. The provisioning tooling creates the database, role
# and the <name>-db Secret (libpq env: PGHOST, PGUSER, DATABASE_URL, ...).
database:
  enabled: false
  # Where the shared Postgres runs (for the egress NetworkPolicy)
  namespace: postgres
  cluster: postgres
  port: 5432
  clientLabel:
    key: lab/postgres-client
    value: "true"
