nameOverride: ""
replicaCount: 1

image:
  repository: web-service
  tag: "0.1.0"
  # Images are side-loaded into kind, so never pull from a registry
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: NodePort
  port: 80
  nodePort: null

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 128Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true

# Expose through the cluster's shared Gateway (cluster-addons/gateway)
route:
  enabled: false
  hostname: ""          # set per environment by the ApplicationSet
  gateway:
    name: shared
    namespace: gateway
    sectionName: https

# Prometheus metrics at /metrics on the http port, collected by the
# cluster's Alloy through a PodMonitor
metrics:
  enabled: false
  path: /metrics
  interval: 30s

# Own PostgreSQL database. The provisioning tooling creates the database, role
# and the <name>-db Secret (libpq env: PGHOST, PGUSER, DATABASE_URL, ...).
database:
  # Access to the shared Postgres: a database, a role and a client certificate
  # (templates/database.yaml); connection details arrive as libpq PG* variables
  enabled: false
  # Where the shared Postgres runs
  namespace: postgres
  cluster: postgres
  port: 5432
  # ClusterIssuer of the platform's Postgres CA
  issuer: postgres
  # Where the client certificate is mounted
  certPath: /etc/postgres-client
  clientLabel:
    key: lab/postgres-client
    value: "true"

# Database migrations before each rollout (templates/migrations.yaml). Needs
# database.enabled. The image defaults to <image.repository>/migrations at the
# app's tag: the shared CI builds it from db/migrations.
migrations:
  enabled: false
  image: ""
  backoffLimit: 0
  timeoutSeconds: 600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
