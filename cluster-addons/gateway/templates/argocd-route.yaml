{{- if .Values.argocdRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: {{ .Values.argocdRoute.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
      namespace: {{ .Release.Namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.argocdRoute.hostname | required "argocdRoute.hostname is required" | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.argocdRoute.service }}
          port: {{ .Values.argocdRoute.port }}
{{- end }}
