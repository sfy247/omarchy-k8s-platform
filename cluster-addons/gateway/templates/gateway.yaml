apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gatewayName }}-tls
spec:
  secretName: {{ .Values.gatewayName }}-tls
  dnsNames:
    {{- range include "gateway.hostnames" . | fromJsonArray }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer.name }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayName }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      {{- include "gateway.listenerHostname" . }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      {{- include "gateway.listenerHostname" . }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gatewayName }}-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Plain HTTP only ever redirects to HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
