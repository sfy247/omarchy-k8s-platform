{{- if .Values.ingest.enabled }}
# Server certificate for the ingest listener. cert-manager also stores the
# issuing CA in it (ca.crt), which the policy below uses to verify clients.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gatewayName }}-ingest-tls
spec:
  secretName: {{ .Values.gatewayName }}-ingest-tls
  dnsNames:
    - {{ required "ingest.hostname is required" .Values.ingest.hostname | quote }}
  usages: [server auth, digital signature, key encipherment]
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer.name }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# mTLS: only clients presenting a certificate signed by the lab CA connect
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.gatewayName }}-ingest-mtls
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayName }}
      sectionName: ingest
  tls:
    clientValidation:
      caCertificateRefs:
        - kind: Secret
          group: ""
          name: {{ .Values.gatewayName }}-ingest-tls
{{- end }}
