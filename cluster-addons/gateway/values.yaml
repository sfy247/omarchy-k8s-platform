# Space-separated hostnames this gateway serves, e.g. "*.dev.<domain>" on a
# worker or "argocd.<domain> backstage.<domain>" on the hub. Supplied per
# cluster by Argo CD from the cluster's annotations. One name pins the
# listeners to it; several share one certificate and routes filter by host.
hostnames: ""

gatewayName: shared
gatewayClassName: envoy
envoyNamespace: envoy-gateway-system

# NodePorts the Envoy service uses; kind maps the cluster's own loopback IP
# :80/:443 onto these
nodePorts:
  http: 31080
  https: 31443

# cert-manager ClusterIssuer backed by the lab CA. The CA key pair is written
# into cert-manager/<caSecretName> by the provisioning tooling, never by Git.
issuer:
  name: lab-ca
  caSecretName: lab-ca

# mTLS listener where observability agents push telemetry (hub only).
# Reached from other clusters over the kind Docker network at
# https://<hostname>:<nodePort>; clients need a certificate from the lab CA.
ingest:
  enabled: false
  hostname: ""        # server certificate name, e.g. mgmt-control-plane
  port: 9443
  nodePort: 31090

# Route argocd-server through this gateway (hub only)
argocdRoute:
  enabled: false
  hostname: ""
  namespace: argocd
  service: argocd-server
  port: 80
