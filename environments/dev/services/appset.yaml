# One app per apps/services/<name>, deployed to the cluster registered with
# environment=dev. Hostnames come from that cluster's lab/domain annotation,
# so no domain is hard-coded here.
# Values: apps/services/<name>/values.yaml, then values-dev.yaml if present.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  environment: dev
          - git:
              repoURL: https://github.com/sfy247/omarchy-k8s-platform.git
              revision: main
              directories:
                - path: apps/services/*
  template:
    metadata:
      name: 'services-{{.path.basename}}-dev'
      labels:
        app.kubernetes.io/part-of: services
        environment: dev
    spec:
      project: services-dev
      source:
        repoURL: https://github.com/sfy247/omarchy-k8s-platform.git
        targetRevision: main
        path: charts/web-service
        helm:
          releaseName: '{{.path.basename}}'
          valueFiles:
            - '../../{{.path.path}}/values.yaml'
            - '../../{{.path.path}}/values-dev.yaml'
          ignoreMissingValueFiles: true
          parameters:
            - name: route.enabled
              value: "true"
            - name: route.hostname
              value: '{{.path.basename}}.{{index .metadata.annotations "lab/domain"}}'
      destination:
        name: '{{.name}}'
        namespace: services
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            # Pod Security Admission: reject any pod that is not fully hardened
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
