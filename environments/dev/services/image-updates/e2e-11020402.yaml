# Rolls e2e-11020402 forward in dev: when CI publishes a newer sha-<commit>
# image, Image Updater commits the tag to values-dev.yaml and Argo CD deploys it.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  annotations:
    # The ImageUpdater CRD is installed by an app synced alongside this one
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: services-e2e-11020402-dev
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/image-updater-git
    gitConfig:
      branch: main
      writeBackTarget: helmvalues:/apps/services/e2e-11020402/values-dev.yaml
  applicationRefs:
    - namePattern: services-e2e-11020402-dev
      images:
        - alias: app
          imageName: ghcr.io/sfy247/e2e-11020402
          commonUpdateSettings:
            updateStrategy: newest-build
            # Update even before the app reports the image as running (first
            # rollout, or while a broken version is crash-looping)
            forceUpdate: true
            allowTags: regexp:^sha-[0-9a-f]{40}$
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
