# One app per apps/hello-world/<name>, deployed to the cluster registered with
# environment=prod. Hostnames come from that cluster's lab/domain annotation,
# so no domain is hard-coded here.
# Values: apps/hello-world/<name>/values.yaml, then values-prod.yaml if present.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-world-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  environment: prod
          - git:
              repoURL: https://github.com/sfy247/omarchy-k8s-platform.git
              revision: main
              directories:
                - path: apps/hello-world/*
  template:
    metadata:
      name: 'hello-world-{{.path.basename}}-prod'
      labels:
        app.kubernetes.io/part-of: hello-world
        environment: prod
    spec:
      project: hello-world-prod
      source:
        repoURL: https://github.com/sfy247/omarchy-k8s-platform.git
        targetRevision: main
        path: charts/web-service
        helm:
          releaseName: '{{.path.basename}}'
          valueFiles:
            - '../../{{.path.path}}/values.yaml'
            - '../../{{.path.path}}/values-prod.yaml'
          ignoreMissingValueFiles: true
          parameters:
            - name: route.enabled
              value: "true"
            - name: route.hostname
              value: '{{.path.basename}}.{{index .metadata.annotations "lab/domain"}}'
      destination:
        name: '{{.name}}'
        namespace: hello-world
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            # Pod Security Admission: reject any pod that is not fully hardened
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
