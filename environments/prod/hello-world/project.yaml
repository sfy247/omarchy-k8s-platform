# Least privilege: one repo, one namespace on the prod cluster, and only the
# kinds the web-service chart renders
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hello-world-prod
  namespace: argocd
spec:
  description: hello-world services in prod
  sourceRepos:
    - https://github.com/sfy247/omarchy-k8s-platform.git
  destinations:
    - name: prod
      namespace: hello-world
  # Only so Argo CD can create the namespace (CreateNamespace=true)
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
  namespaceResourceWhitelist:
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: networking.k8s.io, kind: NetworkPolicy }
  orphanedResources:
    warn: true
